<script>
document.addEventListener("DOMContentLoaded", function() {
  const main = document.querySelector('main');
  const mapContainer = document.getElementById('map-container');

  let scale = 0.6;
  let translateX = 0;
  let translateY = 0;
  let isDragging = false;
  let startX = 0, startY = 0;

  const minScale = 0.35;
  const maxScale = 3.5;

  function getMapBounds() {
    const mainWidth = main ? (main.clientWidth || window.innerWidth) : window.innerWidth;
    const mainHeight = main ? (main.clientHeight || window.innerHeight) : window.innerHeight;
    
    const mapW = 1900 * scale;
    const mapH = 1344 * scale;

    const maxTx = Math.max(0, (mapW - mainWidth) / 2) + mainWidth * 0.35;
    const maxTy = Math.max(0, (mapH - mainHeight) / 2) + mainHeight * 0.35;
    
    return {
      minX: -maxTx,
      maxX: maxTx,
      minY: -maxTy,
      maxY: maxTy
    };
  }

  function applyTransform(smooth) {
    if (!mapContainer) return;
    const bounds = getMapBounds();
    translateX = Math.max(bounds.minX, Math.min(bounds.maxX, translateX));
    translateY = Math.max(bounds.minY, Math.min(bounds.maxY, translateY));

    mapContainer.style.transition = smooth ? 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)' : 'none';
    mapContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  }

  function resetMap() {
    if (!main) return;
    const mainWidth = main.clientWidth || window.innerWidth;
    const mainHeight = main.clientHeight || window.innerHeight;
    scale = Math.min(mainWidth / 1900, mainHeight / 1344) * 0.95;
    if (scale < 0.4) scale = 0.45;
    translateX = 0;
    translateY = 0;
    applyTransform(true);
  }

  if (main && mapContainer) {
    resetMap();

    main.addEventListener('wheel', function(e) {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const oldScale = scale;
      let newScale = scale * zoomFactor;
      newScale = Math.max(minScale, Math.min(maxScale, newScale));

      if (newScale === oldScale) return;

      const rect = main.getBoundingClientRect();
      const mouseX = e.clientX - rect.left - rect.width / 2;
      const mouseY = e.clientY - rect.top - rect.height / 2;

      translateX = mouseX - (mouseX - translateX) * (newScale / oldScale);
      translateY = mouseY - (mouseY - translateY) * (newScale / oldScale);
      scale = newScale;

      applyTransform(false);
    }, { passive: false });

    main.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
      mapContainer.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      applyTransform(false);
    });

    window.addEventListener('mouseup', function() {
      if (isDragging) {
        isDragging = false;
        mapContainer.style.cursor = 'grab';
      }
    });

    let touchStartDist = 0;
    let startScale = 1;

    main.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        startScale = scale;
      }
    }, { passive: true });

    main.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1 && isDragging) {
        translateX = e.touches[0].clientX - startX;
        translateY = e.touches[0].clientY - startY;
        applyTransform(false);
      } else if (e.touches.length === 2 && touchStartDist > 0) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / touchStartDist;
        scale = Math.max(minScale, Math.min(maxScale, startScale * factor));
        applyTransform(false);
      }
    }, { passive: true });

    main.addEventListener('touchend', function() {
      isDragging = false;
      touchStartDist = 0;
    });

    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnReset = document.getElementById('btn-reset');

    if (btnZoomIn) {
      btnZoomIn.addEventListener('click', function() {
        scale = Math.min(maxScale, scale * 1.25);
        applyTransform(true);
      });
    }
    if (btnZoomOut) {
      btnZoomOut.addEventListener('click', function() {
        scale = Math.max(minScale, scale / 1.25);
        applyTransform(true);
      });
    }
    if (btnReset) {
      btnReset.addEventListener('click', function() {
        resetMap();
      });
    }

    window.addEventListener('message', function(e) {
      if (e.data === 'resetMap') {
        resetMap();
      }
    });

    window.addEventListener('resize', function() {
      applyTransform(false);
    });
  }

  const ZONE_NAMES = {
    'zone_Diplomatique': 'Zone Diplomatique & Ambassades',
    'Espace_B2B': 'Espace B2B Hub (1000 m2)',
    'zone_centrale': 'Zone Centrale SFFF 2026',
    'Urban_Container_Zone': 'Urban Container Food Zone',
    'TN_Gate': 'Pavillon Tunisie & Patrimoine',
    'Free_Zone': 'Free Zone & Espaces Detente',
    'PL_Gate': 'Pavillon Palestine & Moyen-Orient',
    'Euro_Gate': 'Pavillon Europe (France, Italie, Espagne)',
    'USA_Gate': 'Pavillon Ameriques (USA, Mexique, Bresil)',
    'mediterranean_gate': 'Pavillon Mediterranee (Grece, Turquie, Portugal)',
    'Orient_Gate': 'Pavillon Orient & Asie (Japon, Chine, Vietnam)',
    'African_Gate': 'Pavillon Afrique & Afro-Beat',
    'Global_Market': 'Le Marche Global & Souvenirs',
    'Kidz_zone': 'Kidz Zone & Ateliers Mini-Cuisine',
    'Zone_de_Spectale': 'Scene Geante & Zone de Spectacles'
  };

  let tooltip = document.getElementById('map-hover-tooltip');
  if (!tooltip) {
    tooltip = document.createElement('div');
    tooltip.id = 'map-hover-tooltip';
    tooltip.style.cssText = 'position:fixed; z-index:9999; pointer-events:none; display:none; background:rgba(10,10,12,0.45); color:#ffd700; border:1px solid rgba(212,175,55,0.7); padding:8px 16px; border-radius:30px; font-family:Outfit,sans-serif; font-size:13px; font-weight:700; backdrop-filter:blur(12px); box-shadow:0 10px 25px rgba(0,0,0,0.8), 0 0 15px rgba(212,175,55,0.35); transform: translate(-50%, -130%); white-space:nowrap;';
    document.body.appendChild(tooltip);
  }

  const zones = document.querySelectorAll('.interactive-zone, g[id]');
  
  zones.forEach(function(zone) {
    let id = zone.getAttribute('id') || '';
    if (!id || id.startsWith('BG_') || id.startsWith('Contour_') || id.startsWith('Zones_volume_')) return;

    let name = '';
    for (let key in ZONE_NAMES) {
      if (id.toLowerCase().includes(key.toLowerCase())) {
        name = ZONE_NAMES[key];
        break;
      }
    }
    if (!name) {
      name = id.split('_')[0].replace(/([A-Z])/g, ' ').trim();
    }

    zone.style.cursor = 'pointer';
    zone.style.opacity = '0.65';
    zone.style.transition = 'all 0.3s ease';

    zone.addEventListener('mouseenter', function(e) {
      tooltip.innerText = name;
      tooltip.style.display = 'block';
      zone.style.opacity = '0.85';
      zone.style.filter = 'brightness(1.1) drop-shadow(0 0 16px rgba(212, 175, 55, 1))';
    });

    zone.addEventListener('mousemove', function(e) {
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + 'px';
    });

    zone.addEventListener('mouseleave', function() {
      tooltip.style.display = 'none';
      zone.style.opacity = '0.65';
      zone.style.filter = 'none';
    });
  });
});
</script>
</html>
